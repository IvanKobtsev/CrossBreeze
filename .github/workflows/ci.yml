name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, distribution: linux-x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, distribution: linux-arm64, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, distribution: mac-x86_64, target: x86_64-apple-darwin }
          - { os: macos-15, distribution: mac-arm64, target: aarch64-apple-darwin }
          - { os: windows-2025, distribution: windows-x86_64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, distribution: windows-arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -j 1
      - run: cargo run --locked -p crossbreeze-build -- bundle --target ${{ matrix.distribution }}
      - name: Smoke test bundled executable without PATH
        shell: pwsh
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          $executable = if ($IsWindows) { 'crossbreeze.exe' } else { 'crossbreeze' }
          $binary = Join-Path $PWD "dist/native/$env:DISTRIBUTION/server/$executable"
          $env:PATH = ''
          & $binary --version
          if ($LASTEXITCODE) { throw 'Native server smoke test failed' }
          '[]' | & $binary vite-setup
          if ($LASTEXITCODE) { throw 'Native setup smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.distribution }}
          path: dist/native/${{ matrix.distribution }}/
          if-no-files-found: error
  plugin:
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/downloaded
      - name: Arrange native bundles
        shell: bash
        run: |
          mkdir -p dist/native
          for bundle in dist/downloaded/native-*; do
            target="${bundle##*/native-}"
            mv "$bundle" "dist/native/$target"
          done
          chmod +x dist/native/linux-*/server/crossbreeze dist/native/mac-*/server/crossbreeze gradlew
      - run: ./gradlew test verifyPlugin verifyPluginArchive -Pcrossbreeze.prebuiltNative=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-native-plugins
          path: build/distributions/crossbreeze-*.zip
          if-no-files-found: error
          retention-days: 30
