name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run bundle
      - run: npm run verify:bundle
  plugin:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - run: chmod +x gradlew
      - run: ./gradlew test verifyPlugin verifyPluginArchive --stacktrace
      - name: Upload Linux x86_64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-linux-x86_64
          path: build/distributions/crossbreeze-*-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux ARM64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-linux-arm64
          path: build/distributions/crossbreeze-*-linux-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS x86_64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-mac-x86_64
          path: build/distributions/crossbreeze-*-mac-x86_64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS ARM64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-mac-arm64
          path: build/distributions/crossbreeze-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows x86_64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-windows-x86_64
          path: build/distributions/crossbreeze-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows ARM64 plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-windows-arm64
          path: build/distributions/crossbreeze-*-windows-arm64.zip
          if-no-files-found: error
          retention-days: 30
