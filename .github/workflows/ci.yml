name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run bundle
      - run: npm run verify:bundle
  plugin:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - run: chmod +x gradlew
      - run: ./gradlew test verifyPlugin verifyPluginArchive --stacktrace
      - name: Upload installable WebStorm plugin
        uses: actions/upload-artifact@v4
        with:
          name: crossbreeze-webstorm-plugin
          path: build/distributions/crossbreeze-*.zip
          if-no-files-found: error
          retention-days: 30
